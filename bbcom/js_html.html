<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE PARFUM | 精品香水官方網站</title>
    <style>
        :root {
            --bg-obsidian: #0A0A0C;
            --bg-card: #141418;
            --bg-card-hover: #1D1D24;
            --gold-primary: #D4AF37;
            --gold-light: #F9E7B3;
            --gold-dark: #997A15;
            --text-champagne: #F7F3EB;
            --text-muted: #A0A0AA;
            --border-gold: rgba(212, 175, 55, 0.25);
            --font-serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-champagne);
            font-family: var(--font-sans);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-obsidian);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gold-primary);
            border-radius: 4px;
        }

        /* Typography Helper */
        .gold-gradient-text {
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Header Navigation */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: rgba(10, 10, 12, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-gold);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
        }

        .brand-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
        }

        .brand-logo h1 {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            letter-spacing: 0.25em;
            font-weight: 700;
            text-transform: uppercase;
        }

        .brand-logo span {
            font-size: 0.55rem;
            letter-spacing: 0.4em;
            color: var(--gold-primary);
            text-transform: uppercase;
            margin-top: -3px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-champagne);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--gold-primary);
        }

        /* Cart Icon Trigger with Pulse FX */
        .cart-icon-btn {
            position: relative;
            background: transparent;
            border: 1px solid var(--border-gold);
            color: var(--text-champagne);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .cart-icon-btn:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            color: var(--gold-primary);
        }

        .cart-icon-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--gold-primary);
            color: #000;
            font-weight: 700;
            font-size: 0.7rem;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Hero Banner */
        .hero {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px 60px;
            background: radial-gradient(circle at center, rgba(212, 175, 55, 0.08) 0%, rgba(10, 10, 12, 1) 70%);
            position: relative;
        }

        .hero-tag {
            border: 1px solid var(--border-gold);
            background: rgba(212, 175, 55, 0.08);
            color: var(--gold-light);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .hero h2 {
            font-family: var(--font-serif);
            font-size: 3rem;
            font-weight: 400;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .hero p {
            max-width: 600px;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        /* Main Product Grid Section */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 100px;
        }

        .section-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-header h3 {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-weight: 400;
            color: var(--text-champagne);
        }

        .section-header .divider {
            width: 60px;
            height: 1px;
            background: var(--gold-primary);
            margin: 15px auto 0;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* Product Card */
        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: rgba(212, 175, 55, 0.6);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(212, 175, 55, 0.15);
        }

        .card-img-wrap {
            position: relative;
            width: 100%;
            padding-top: 100%; /* 1:1 Aspect Ratio */
            overflow: hidden;
            background: #18181f;
        }

        .card-img-wrap img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .product-card:hover .card-img-wrap img {
            transform: scale(1.08);
        }

        .card-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(10, 10, 12, 0.85);
            border: 1px solid var(--border-gold);
            color: var(--gold-primary);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.1em;
        }

        .card-content {
            padding: 24px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-style-tag {
            font-size: 0.7rem;
            color: var(--gold-primary);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .card-title {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-champagne);
        }

        .card-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-style: italic;
            margin-bottom: 12px;
        }

        .card-desc {
            font-size: 0.8rem;
            color: #B0B0B8;
            margin-bottom: 20px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 16px;
            margin-top: auto;
        }

        .card-price {
            font-family: var(--font-serif);
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--gold-light);
        }

        /* Cool Add To Cart Button */
        .add-cart-btn {
            position: relative;
            background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-dark) 100%);
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 24px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .add-cart-btn:hover {
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            transform: scale(1.03);
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 100%);
        }

        .add-cart-btn:active {
            transform: scale(0.96);
        }

        /* ★ COOL SPECIAL EFFECTS FOR ADD TO CART ★ */

        /* 1. Flying Clone Element */
        .flying-item {
            position: fixed;
            z-index: 9999;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold-primary);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.8), 0 0 40px rgba(212, 175, 55, 0.4);
            pointer-events: none;
            transition: all 0.9s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        /* 2. Particle Sparks */
        .particle {
            position: fixed;
            z-index: 9998;
            width: 6px;
            height: 6px;
            background: var(--gold-light);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 8px var(--gold-primary);
            animation: particleFade 0.7s forwards ease-out;
        }

        @keyframes particleFade {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) scale(0.2);
            }
        }

        /* 3. Cart Icon Shake & Pulse Keyframes */
        @keyframes cartShake {
            0% { transform: scale(1); }
            20% { transform: scale(1.3) rotate(-12deg); }
            40% { transform: scale(1.3) rotate(12deg); }
            60% { transform: scale(1.3) rotate(-8deg); }
            80% { transform: scale(1.2) rotate(4deg); }
            100% { transform: scale(1); }
        }

        .cart-shake {
            animation: cartShake 0.6s ease-in-out;
            color: var(--gold-light) !important;
            border-color: var(--gold-primary) !important;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.7);
        }

        /* Notification Toast */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            background: rgba(20, 20, 24, 0.95);
            border: 1px solid var(--gold-primary);
            color: var(--text-champagne);
            padding: 14px 22px;
            border-radius: 12px;
            font-size: 0.85rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(212, 175, 55, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Shopping Cart Drawer */
        .cart-drawer-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .cart-drawer-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 420px;
            height: 100%;
            background: var(--bg-card);
            border-left: 1px solid var(--border-gold);
            z-index: 201;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        .cart-drawer.active {
            transform: translateX(0);
        }

        .cart-header {
            padding: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h4 {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            color: var(--text-champagne);
        }

        .close-cart-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-cart-btn:hover {
            color: var(--gold-primary);
        }

        .cart-body {
            flex-grow: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .cart-empty-state {
            text-align: center;
            color: var(--text-muted);
            margin: auto 0;
            font-size: 0.9rem;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px;
        }

        .cart-item-img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }

        .cart-item-info {
            flex-grow: 1;
        }

        .cart-item-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-champagne);
        }

        .cart-item-price {
            font-size: 0.8rem;
            color: var(--gold-primary);
            margin-top: 2px;
        }

        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .qty-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .cart-footer {
            padding: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(10, 10, 12, 0.6);
        }

        .cart-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-dark) 100%);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkout-btn:hover {
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--border-gold);
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>

                id: '09',
                num: 'No. 09',
                name: '晨露橙花',
                enName: 'Dewy Neroli',
                style: '明亮白花香調',
                price: 4500,
                desc: '採摘清晨微露下的純白橙花，清新乾淨、明亮動人，散發讓人想靠近的純真感。',
                img: 'images/09.jpg'
            },
            {
                id: '10',
                num: 'No. 10',
                name: '冷冽大地',
                enName: 'Alpine Vetiver',
                style: '干爽辛香木質調',
                price: 5100,
                desc: '高山上的冷冽空氣與堅硬岩石。杜松子引出乾燥俐落的香根草，展現理性氣場。',
                img: 'images/10.jpg'
            }
        ];

        // Fallback Image SVG Generator
        function getFallbackImage(title) {
            return `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><rect width="400" height="400" fill="%23141418"/><circle cx="200" cy="200" r="120" fill="none" stroke="%23D4AF37" stroke-width="2" opacity="0.3"/><rect x="150" y="120" width="100" height="160" rx="10" fill="none" stroke="%23D4AF37" stroke-width="2"/><text x="200" y="210" font-family="serif" font-size="18" fill="%23F7F3EB" text-anchor="middle">${encodeURIComponent(title)}</text></svg>`;
        }

        // App State
        let cart = [];

        // DOM Render
        document.addEventListener('DOMContentLoaded', () => {
            renderGrid();
            setupCartEvents();
        });

        function renderGrid() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            perfumes.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="card-img-wrap">
                        <img src="${p.img}" onerror="this.src='${getFallbackImage(p.name)}'" alt="${p.name}">
                        <span class="card-badge">${p.num}</span>
                    </div>
                    <div class="card-content">
                        <div>
                            <div class="card-style-tag">${p.style}</div>
                            <h4 class="card-title">${p.name}</h4>
                            <div class="card-subtitle">${p.enName}</div>
                            <p class="card-desc">${p.desc}</p>
                        </div>
                        <div class="card-footer">
                            <div class="card-price">NT$ ${p.price.toLocaleString()}</div>
                            <button class="add-cart-btn" onclick="addToCartWithEffects(event, '${p.id}')">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h14v12z"/></svg>
                                加入購物車
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ★ COOL EFFECT: Fly-to-Cart Parabola + Particle Sparks + Cart Shake ★
        function addToCartWithEffects(event, id) {
            const perfume = perfumes.find(p => p.id === id);
            if (!perfume) return;

            const btn = event.currentTarget;
            const card = btn.closest('.product-card');
            const imgElem = card.querySelector('img');
            const cartBtn = document.getElementById('cartTrigger');

            // 1. Particle Sparkles Explosion around the button
            createParticles(btn);

            // 2. Parabolic Fly-to-Cart Animation
            const imgRect = imgElem.getBoundingClientRect();
            const cartRect = cartBtn.getBoundingClientRect();

            const flyer = document.createElement('img');
            flyer.src = imgElem.src;
            flyer.className = 'flying-item';
            flyer.style.left = `${imgRect.left + imgRect.width / 2 - 35}px`;
            flyer.style.top = `${imgRect.top + imgRect.height / 2 - 35}px`;

            document.body.appendChild(flyer);

            // Trigger animation frame for Smooth Bezier Curve transition
            requestAnimationFrame(() => {
                const targetX = cartRect.left + cartRect.width / 2 - 15;
                const targetY = cartRect.top + cartRect.height / 2 - 15;

                flyer.style.transform = `translate(${targetX - (imgRect.left + imgRect.width / 2 - 35)}px, ${targetY - (imgRect.top + imgRect.height / 2 - 35)}px) scale(0.18) rotate(720deg)`;
                flyer.style.opacity = '0.3';
            });

            // 3. Upon Arrival -> Shake Cart, Update State, Show Toast
            setTimeout(() => {
                flyer.remove();

                // Trigger Cart Icon Shake
                cartBtn.classList.add('cart-shake');
                setTimeout(() => cartBtn.classList.remove('cart-shake'), 600);

                // Add to internal state
                const existing = cart.find(item => item.id === id);
                if (existing) {
                    existing.qty += 1;
                } else {
                    cart.push({ ...perfume, qty: 1 });
                }

                updateCartUI();
                showToast(`已成功加入「${perfume.name}」到購物車！`);
            }, 850);
        }

        // Particle Burst Generator
        function createParticles(element) {
            const rect = element.getBoundingClientRect();
            const count = 12;

            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${rect.left + rect.width / 2}px`;
                particle.style.top = `${rect.top + rect.height / 2}px`;

                const angle = (i / count) * Math.PI * 2;
                const distance = 40 + Math.random() * 30;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                particle.style.setProperty('--dx', `${dx}px`);
                particle.style.setProperty('--dy', `${dy}px`);

                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 700);
            }
        }

        // Update Cart Drawer & Badge UI
        function updateCartUI() {
            const badge = document.getElementById('cartCount');
            const body = document.getElementById('cartBody');
            const totalElem = document.getElementById('cartTotal');

            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

            badge.innerText = totalQty;
            badge.style.transform = 'scale(1.4)';
            setTimeout(() => badge.style.transform = 'scale(1)', 200);

            if (cart.length === 0) {
                body.innerHTML = `<div class="cart-empty-state">購物車目前是空的</div>`;
            } else {
                body.innerHTML = '';
                cart.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'cart-item';
                    row.innerHTML = `
                        <img src="${item.img}" onerror="this.src='${getFallbackImage(item.name)}'" class="cart-item-img">
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.name}</div>
                            <div class="cart-item-price">NT$ ${item.price.toLocaleString()}</div>
                            <div class="cart-item-qty">
                                <button class="qty-btn" onclick="changeQty('${item.id}', -1)">-</button>
                                <span>${item.qty}</span>
                                <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
                            </div>
                        </div>
                    `;
                    body.appendChild(row);
                });
            }

            totalElem.innerText = `NT$ ${totalPrice.toLocaleString()}`;
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;

            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            updateCartUI();
        }

        // Toast Notification System
        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#D4AF37"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                <span>${msg}</span>
            `;

            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Setup Event Handlers for Drawer
        function setupCartEvents() {
            const trigger = document.getElementById('cartTrigger');
            const closeBtn = document.getElementById('closeCart');
            const backdrop = document.getElementById('cartBackdrop');
            const drawer = document.getElementById('cartDrawer');

            function openDrawer() {
                drawer.classList.add('active');
                backdrop.classList.add('active');
            }

            function closeDrawer() {
                drawer.classList.remove('active');
                backdrop.classList.remove('active');
            }

            trigger.addEventListener('click', openDrawer);
            closeBtn.addEventListener('click', closeDrawer);
            backdrop.addEventListener('click', closeDrawer);
        }

        function handleCheckout() {
            if (cart.length === 0) {
                showToast('購物車內尚無商品！');
                return;
            }
            showToast('感謝您的預訂！正在導向尊榮安全結帳頁面...');
        }
    </script>
</body>
</html>
